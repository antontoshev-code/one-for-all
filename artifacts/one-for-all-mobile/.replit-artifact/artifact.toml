kind = "mobile"
previewPath = "/mobile/"
title = "One for All Mobile"
description = "Native mobile companion for One for All — a voice-first personal capture app. Record or type a thought, get a mock transcript, process it in the Inbox into Journal/Tasks/Ideas/Log categories, link people, and manage settings. Talks to the existing /api backend."
version = "1.0.0"
id = "artifacts/one-for-all-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 25800

[services.development]
run = "pnpm --filter @workspace/one-for-all-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/one-for-all-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/one-for-all-mobile", "run", "serve" ]

[services.env]
PORT = "25800"
BASE_PATH = "/mobile/"
