openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: One for All – voice-first personal capture API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: entries
    description: Capture entries (voice or text)
  - name: people
    description: People linked to entries
  - name: captures
    description: Original captures and what they were split into
  - name: data
    description: Export and erasure
  - name: vocabulary
    description: Per-user words that improve transcription
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Entries ────────────────────────────────────────────────────────────────
  /entries:
    get:
      operationId: listEntries
      tags: [entries]
      summary: List entries, optionally filtered by category
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [inbox, journal, task, idea, log]
      responses:
        "200":
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
    post:
      operationId: createEntry
      tags: [entries]
      summary: Create a new capture entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryInput"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"

  /entries/stats:
    get:
      operationId: getEntryStats
      tags: [entries]
      summary: Get per-category counts and inbox count
      responses:
        "200":
          description: Entry statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryStats"

  /entries/{id}:
    get:
      operationId: getEntry
      tags: [entries]
      summary: Get a single entry with linked people
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Entry detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateEntry
      tags: [entries]
      summary: Update an entry (categorize, toggle done, edit text)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryUpdate"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteEntry
      tags: [entries]
      summary: Delete an entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /entries/{id}/people:
    post:
      operationId: linkPersonToEntry
      tags: [entries]
      summary: Link a person to an entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkPersonInput"
      responses:
        "200":
          description: Updated entry detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryDetail"

  /entries/{id}/people/{personId}:
    delete:
      operationId: unlinkPersonFromEntry
      tags: [entries]
      summary: Remove a person link from an entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: personId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated entry detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryDetail"

  # ── People ─────────────────────────────────────────────────────────────────
  /people:
    get:
      operationId: listPeople
      tags: [people]
      summary: List all people
      responses:
        "200":
          description: List of people
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
    post:
      operationId: createPerson
      tags: [people]
      summary: Create a new person record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonInput"
      responses:
        "201":
          description: Created person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"

  /people/{id}:
    get:
      operationId: getPerson
      tags: [people]
      summary: Get a person with their linked entries
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Person detail with entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePerson
      tags: [people]
      summary: Update a person's name or notes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonUpdate"
      responses:
        "200":
          description: Updated person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
    delete:
      operationId: deletePerson
      tags: [people]
      summary: Delete a person record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Restore ────────────────────────────────────────────────────────────────
  # Deleting marks a row rather than removing it, so Undo can return the same
  # entry with its people links intact instead of a copy that merely resembles it.
  /entries/{id}/restore:
    post:
      operationId: restoreEntry
      tags: [entries]
      summary: Undo a deleted entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
        "404":
          description: No deleted entry with that id belongs to the caller

  /people/{id}/restore:
    post:
      operationId: restorePerson
      tags: [people]
      summary: Undo a deleted person
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
        "404":
          description: No deleted person with that id belongs to the caller

  # ── Captures ───────────────────────────────────────────────────────────────
  # The original text of a capture, kept whole even after it is split into
  # separate entries, so the words as spoken are never lost to categorisation.
  /captures:
    get:
      operationId: listCaptures
      tags: [captures]
      summary: List past captures with what each became
      responses:
        "200":
          description: Captures, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Capture"
    post:
      operationId: createCapture
      tags: [captures]
      summary: Record a capture and the entries it produced
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCapture"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capture"

  # ── Data ───────────────────────────────────────────────────────────────────
  # Access and erasure. These are the rights the privacy policy promises, so
  # they are part of the contract rather than an administrative extra.
  /data/export:
    get:
      operationId: exportData
      tags: [data]
      summary: Everything belonging to the signed-in user
      responses:
        "200":
          description: Full export
          content:
            application/json:
              schema:
                type: object

  /data/clear:
    post:
      operationId: clearData
      tags: [data]
      summary: Delete all content, keeping the account
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /data/account:
    delete:
      operationId: deleteAccount
      tags: [data]
      summary: Delete the account and everything in it
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean


  # ── Vocabulary ─────────────────────────────────────────────────────────────
  # Words this user is known to use. Transcription mangles proper nouns, and no
  # general model knows that this person says "тараторче" or has a friend called
  # Дани. Strictly per-user: there is no path from one person's words to
  # another's transcription.
  /vocabulary:
    get:
      operationId: listVocabulary
      tags: [vocabulary]
      summary: The user's own word list
      responses:
        "200":
          description: Words, both learned and kept
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VocabularyWord"

  /vocabulary/learn:
    post:
      operationId: learnVocabulary
      tags: [vocabulary]
      summary: Remember words the user corrected by hand
      description: >
        Called when a capture is saved after editing. The server compares the
        transcript it produced against what was saved and keeps the single-word
        repairs. Rewrites are ignored: once the word count changes, position no
        longer identifies the same word.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [original, edited]
              properties:
                original:
                  type: string
                  description: The transcript as delivered
                edited:
                  type: string
                  description: What the user actually saved
      responses:
        "200":
          description: How many words were learned
          content:
            application/json:
              schema:
                type: object
                properties:
                  learned:
                    type: integer
                  reason:
                    type: string

  /vocabulary/keep:
    post:
      operationId: keepWord
      tags: [vocabulary]
      summary: Stop correcting a word the user put back
      description: >
        Undoing a suggested correction says the original was right. Without
        this the app would repeat the same wrong correction on every capture.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [word]
              properties:
                word:
                  type: string
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /vocabulary/{id}:
    delete:
      operationId: deleteVocabularyWord
      tags: [vocabulary]
      summary: Remove a word that was learned wrongly
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted


components:
  schemas:
    VocabularyWord:
      type: object
      required: [id, word, kind, source]
      properties:
        id:
          type: integer
        word:
          type: string
        kind:
          type: string
          enum: [use, keep]
          description: >
            "use" biases transcription toward the word and corrects towards it.
            "keep" marks a word never to be corrected away, recorded when the
            user undoes a suggestion.
        source:
          type: string
          enum: [learned, manual]

    Capture:
      type: object
      required: [id, content, createdAt]
      properties:
        id:
          type: integer
        content:
          type: string
          description: The capture exactly as it arrived, before any splitting
        captureType:
          type: string
        createdAt:
          type: string
          format: date-time
        entries:
          type: array
          items:
            type: object
            properties:
              entryId:
                type: integer
              category:
                type: string
              content:
                type: string
                nullable: true
              exists:
                type: boolean
                description: False once the entry it became has been deleted

    CreateCapture:
      type: object
      required: [content]
      properties:
        content:
          type: string
        captureType:
          type: string
        entries:
          type: array
          items:
            type: object
            required: [entryId, category]
            properties:
              entryId:
                type: integer
              category:
                type: string

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Entry ────────────────────────────────────────────────────────────────
    Entry:
      type: object
      required: [id, content, captureType, category, isTaskDone, suggestedCategory, createdAt, updatedAt]
      properties:
        id:
          type: integer
        content:
          type: string
        captureType:
          type: string
          enum: [voice, text]
        category:
          type: string
          enum: [inbox, journal, task, idea, log]
        isTaskDone:
          type: boolean
        suggestedCategory:
          type: ["string", "null"]
          enum: [journal, task, idea, log, null]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EntryDetail:
      allOf:
        - $ref: "#/components/schemas/Entry"
        - type: object
          required: [people]
          properties:
            people:
              type: array
              items:
                $ref: "#/components/schemas/Person"

    EntryInput:
      type: object
      required: [content, captureType]
      properties:
        content:
          type: string
          minLength: 1
        captureType:
          type: string
          enum: [voice, text]
        category:
          type: string
          enum: [inbox, journal, task, idea, log]
        suggestedCategory:
          type: string
          enum: [journal, task, idea, log]

    EntryUpdate:
      type: object
      properties:
        content:
          type: string
          minLength: 1
        category:
          type: string
          enum: [inbox, journal, task, idea, log]
        isTaskDone:
          type: boolean
        suggestedCategory:
          type: string
          enum: [journal, task, idea, log]

    EntryStats:
      type: object
      required: [inbox, journal, task, idea, log, total]
      properties:
        inbox:
          type: integer
        journal:
          type: integer
        task:
          type: integer
        idea:
          type: integer
        log:
          type: integer
        total:
          type: integer

    LinkPersonInput:
      type: object
      required: [personId]
      properties:
        personId:
          type: integer

    # ── Person ───────────────────────────────────────────────────────────────
    Person:
      type: object
      required: [id, name, aliases, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        notes:
          type: ["string", "null"]
        descriptor:
          type: ["string", "null"]
          description: Optional short label to distinguish same-named people, e.g. "Studentina", "climbing gym"
        aliases:
          type: array
          items:
            type: string
          description: >-
            Alternate spellings this person is known by, e.g. "Petja" or "Петя"
            for "Petya". Mention detection matches against name and aliases.
        birthday:
          type: ["string", "null"]
          description: Free text so partial birthdays ("October") are possible, not just full dates
        countryOfOrigin:
          type: ["string", "null"]
        countryOfResidence:
          type: ["string", "null"]
          description: Left blank when the person still lives where they are from
        howWeMet:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    PersonDetail:
      allOf:
        - $ref: "#/components/schemas/Person"
        - type: object
          required: [entries]
          properties:
            entries:
              type: array
              items:
                $ref: "#/components/schemas/Entry"

    PersonInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        notes:
          type: string
        descriptor:
          type: string
          description: Optional short label to distinguish same-named people
        aliases:
          type: array
          items:
            type: string
        birthday:
          type: string
        countryOfOrigin:
          type: string
        countryOfResidence:
          type: string
        howWeMet:
          type: string

    PersonUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        notes:
          type: string
        descriptor:
          type: string
          description: Optional short label to distinguish same-named people
        aliases:
          type: array
          items:
            type: string
        birthday:
          type: string
        countryOfOrigin:
          type: string
        countryOfResidence:
          type: string
        howWeMet:
          type: string
